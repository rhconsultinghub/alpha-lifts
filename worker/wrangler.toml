name = "alpha-lifts-coach"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Origins allowed to call this Worker. The GitHub Pages deployment plus local dev.
# Anything not listed here is rejected before the API is ever called — this is what
# stops a random site from spending your API budget through your Worker.
#
# This is the ORIGIN only (scheme + host, no path): Pages serves the app at
# https://rhconsultinghub.github.io/alpha-lifts/, but the browser sends the bare
# origin in the Origin header. Derived from the git remote (rhconsultinghub/alpha-lifts)
# — a project site is always https://<owner>.github.io. If a custom domain is ever
# added, this needs to change with it, or every request 403s.
[vars]
ALLOWED_ORIGINS = "https://rhconsultinghub.github.io,http://localhost:5173"

# Set to "true" to require the coach access allowlist (see src/access.ts + README "Access
# allowlist"). While off, anyone whose Origin is allowed can use the coach. Approved ids are KV
# keys `allow:<id>` in the USAGE namespace:
#   npx wrangler kv key put --binding=USAGE "allow:<coach-id-from-app>" "1"
# The <coach-id> is shown to each user at the bottom of the Coach tab.
REQUIRE_ALLOWLIST = "true"

# ANTHROPIC_API_KEY is NOT set here — wrangler.toml is committed to git.
# Set it as an encrypted secret instead:
#   npx wrangler secret put ANTHROPIC_API_KEY
# For local dev, put it in worker/.dev.vars (gitignored).
#
# SESSION_SECRET signs the account session tokens (src/auth.ts). Same rule — it's a secret, not
# committed here:
#   npx wrangler secret put SESSION_SECRET      # paste a long random string
# For local dev, add a line to worker/.dev.vars:  SESSION_SECRET=some-long-random-dev-string
# Rotating it invalidates every outstanding login at once (the break-glass revoke).

# D1 database backing user accounts + synced state (src/db.ts, src/handlers.ts). Create it once:
#   npx wrangler d1 create alpha-lifts-db        # prints a database_id
# paste that id below (replacing REPLACE_WITH_D1_DATABASE_ID), then apply the schema:
#   npx wrangler d1 execute alpha-lifts-db --remote --file=schema.sql
# The account routes 503 ("accounts_not_configured") until DB + SESSION_SECRET are both present,
# so the coach keeps working even before this is set up.
[[d1_databases]]
binding = "DB"
database_name = "alpha-lifts-db"
database_id = "6ad3186c-a28a-4385-98f3-4a2853aef3ac"

# Per-device monthly spend cap ($1.50, see src/usage.ts). Create the namespace once with
#   npx wrangler kv namespace create USAGE
# and paste the printed id below (replacing REPLACE_WITH_KV_NAMESPACE_ID). Until a real id is
# in place, deploy will fail on this binding; usage.ts fails open if the binding is absent, so
# you can also just delete this block to ship without enforcement.
[[kv_namespaces]]
binding = "USAGE"
id = "496221f5b449499cad2e3dca769cc6d3"
